# fly.worker.toml — smart-scanner-be-prospective-worker-staging
#
# DEDICATED NON-HTTP JOB WORKER. Runs `python -m app.jobs.worker` continuously
# (NO http_service / NO TCP service → no Fly Proxy, no autostart/autostop). It
# claims prospective-queue tasks (concurrency 1) from the ISOLATED Fly Postgres
# via the least-privilege smart_scanner_prospective_worker role
# (JOB_WORKER_DATABASE_URL, a SECRET), runs each real Wyckoff-v2 evaluation in a
# bounded CHILD PROCESS, renews leases + heartbeats, and recovers from hard
# process death via lease expiry. The scheduler LEADER loop also runs here
# (advisory-lock elected) but every schedule ships DISABLED, so it enqueues
# nothing. Constructs NO provider; NO provider credential and NO shared Supabase
# credential are installed. Git SHA supplied at deploy via --build-arg APP_GIT_SHA.

app = 'smart-scanner-be-prospective-worker-staging'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENVIRONMENT = 'prospective-worker-staging'
  # The worker is NOT an HTTP mode app — every HTTP-mode flag is false.
  PROSPECTIVE_CAMPAIGN_ONLY_MODE = 'false'
  AUDIT_ONLY_MODE = 'false'
  MAINTENANCE_ONLY_MODE = 'false'
  HISTORY_WARMUP_ONLY_MODE = 'false'
  # The FastAPI scheduler flag stays off (the web app never schedules); the
  # worker's OWN advisory-locked scheduler leader is gated by JOB_SCHEDULER_ENABLED.
  ENABLE_SCHEDULER = 'false'
  JOB_WORKER_ENABLED = 'true'
  JOB_WORKER_TYPE = 'prospective'
  JOB_WORKER_QUEUES = 'prospective'
  JOB_WORKER_CONCURRENCY = '1'
  JOB_SCHEDULER_ENABLED = 'true'
  JOB_ALLOW_TEST_HANDLERS = 'false'
  REQUIRE_WORKER_TOKEN = 'true'
  MARKET_DATA_PROVIDER = 'massive'          # name only; NO key installed
  LOG_FORMAT = 'json'
  JOB_WORKER_EXPECTED_DB_ROLE = 'smart_scanner_prospective_worker'

# No [http_service] and no [[services]] → the Machine has no exposed port, is
# never started/stopped by inbound traffic, and runs continuously.
[processes]
  worker = 'python -m app.jobs.worker'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['worker']
