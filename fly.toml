# fly.toml — smart-scanner-be-staging
#
# READ-ONLY PRODUCT/AUDIT STAGING. This app boots an exact committed revision,
# exposes GET /version for revision proof, and serves the read-only Smart
# Scanner Product API (/api/scanner/overview|scans|symbol) that the UI consumes.
# It runs NO scheduler, NO background processing and NO live provider
# credentials, and it performs NO writes and NO migrations.
#
# Canonical read source: the isolated Fly Postgres holding the validated
# scanner pipeline output (app `smart-scanner-history-warmup-db-staging`,
# database `warmup`, region fra) — reached over the private 6PN network as the
# least-privilege `smart_scanner_product_reader` role. The connection itself is
# the AUDIT_DATABASE_URL SECRET and is never committed here.
#
# The Git SHA is intentionally NOT set here — it is supplied at deploy time via
# --build-arg APP_GIT_SHA="$(git rev-parse HEAD)" so /version always reflects
# the exact deployed commit.
#
# See docs/reference/configuration at https://fly.io/docs/reference/configuration/

app = 'smart-scanner-be-staging'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

# Non-secret, safety-critical staging toggles. Secrets (WORKER_TOKEN, the
# non-production SUPABASE_* placeholders) are set via `fly secrets set` and are
# never committed here.
[env]
  APP_ENVIRONMENT = 'staging'
  AUDIT_ONLY_MODE = 'true'        # expose ONLY revision/liveness + shadow-cohort audit routes
  ENABLE_SCHEDULER = 'false'      # no cron scans, no background jobs, no provider
  REQUIRE_WORKER_TOKEN = 'true'   # admin surface stays protected (/version is public)
  MARKET_DATA_PROVIDER = 'massive'
  LOG_FORMAT = 'json'
  # The custom read-only role the audit connection MUST authenticate as. This
  # is NON-secret (just a role name). The actual connection (AUDIT_DATABASE_URL)
  # is a SECRET set later via `fly secrets set` — never in fly.toml. Until then,
  # audit mode fails closed (no fallback to any default database identity).
  #
  # smart_scanner_product_reader holds SELECT on ONLY the 9 relations the three
  # Product API routes read (see ops/sql/create_smart_scanner_product_reader.sql)
  # — deliberately narrower than smart_scanner_audit_reader's 13, so the product
  # surface cannot widen with the audit surface.
  AUDIT_EXPECTED_DB_ROLE = 'smart_scanner_product_reader'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Revision-verification health check hits /version (always 200, no DB needed)
  # — NOT /health, which legitimately reports the placeholder DB disconnected.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/version'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
